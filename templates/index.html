<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>SavePulse Pro - Secure Media Downloader</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-base: #050814;
            --bg-surface: rgba(13, 19, 38, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 5%;
        }

        .tool-card {
            background: var(--bg-surface);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            padding: 24px 20px;
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
        }

        .input-box-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-box-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 16px 16px 48px;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid #1e293b;
            border-radius: 16px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        select {
            width: 100%;
            padding: 15px;
            background: rgba(3, 7, 18, 0.85);
            border: 1px solid #1e293b;
            border-radius: 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        .action-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 25px -4px rgba(59, 130, 246, 0.5);
        }

        /* Progress Bar UI Styles */
        #progressContainer {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            margin-bottom: 10px;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #10b981);
            transition: width 0.3s ease;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.6);
        }

        #progressText {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="tool-card">
        <h2 style="margin-bottom: 20px; font-size: 20px; text-align: center;">SavePulse <span style="color: #60a5fa;">Downloader</span></h2>
        
        <div class="input-box-group">
            <i class="fa-solid fa-link"></i>
            <input type="text" id="videoUrl" placeholder="Paste media link here...">
        </div>

        <select id="downloadType">
            <option value="video">Video Stream (MP4)</option>
            <option value="audio">Audio Extract (MP3)</option>
        </select>

        <button class="action-btn" id="startBtn" onclick="startDownloadProcess()">
            <i class="fa-solid fa-cloud-arrow-down"></i> Download to Phone
        </button>

        <div id="progressContainer">
            <div class="progress-track">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="progressText">Initializing server processing... (0%)</div>
        </div>
    </div>

    <script>
        async function startDownloadProcess() {
            const url = document.getElementById('videoUrl').value;
            const type = document.getElementById('downloadType').value;
            const progressContainer = document.getElementById('progressContainer');
            const progressFill = document.getElementById('progressFill');
            const progressText = document.getElementById('progressText');
            const startBtn = document.getElementById('startBtn');

            if (!url) {
                alert('Please provide a link first!');
                return;
            }

            startBtn.style.display = 'none';
            progressContainer.style.display = 'block';
            progressFill.style.width = '10%';
            progressText.innerText = 'Connecting to extraction engine... (10%)';

            try {
                // Request file generation from backend server
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, type: type })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server error occurred');
                }

                progressFill.style.width = '70%';
                progressText.innerText = 'Preparing mobile file package... (70%)';

                // Trigger direct mobile browser download using a temporary anchor element
                const downloadUrl = data.download_url;
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = ''; // Forces browser to treat target as local download attachment
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                progressFill.style.width = '100%';
                progressText.innerText = 'Download complete! Check your device phone folder. ✔';
                
                setTimeout(() => {
                    startBtn.style.display = 'flex';
                    progressContainer.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 4000);

            } catch (err) {
                alert('Error: ' + err.message);
                startBtn.style.display = 'flex';
                progressContainer.style.display = 'none';
            }
        }
    </script>
</body>
</html>
